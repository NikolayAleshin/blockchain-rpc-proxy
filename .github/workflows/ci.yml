name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l -s .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; echo "run: make fmt"; exit 1; fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  vuln:
    name: Vulnerability scan (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    name: Docker build, scan & SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: polygon-rpc-proxy:ci
          build-args: VERSION=${{ github.sha }}

      - name: smoke test container
        run: |
          docker run -d --name rpcproxy -p 8080:8080 polygon-rpc-proxy:ci
          for i in $(seq 1 15); do curl -sf http://127.0.0.1:8080/healthz && break || sleep 1; done
          curl -sf http://127.0.0.1:8080/healthz
          docker rm -f rpcproxy

      - name: trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: polygon-rpc-proxy:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: polygon-rpc-proxy:ci
          format: spdx-json
          output-file: sbom.spdx.json

      - name: upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  terraform:
    name: Terraform validate & scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1

      - name: fmt check
        run: tofu fmt -check -recursive
        working-directory: deploy/terraform

      - name: validate dev env
        working-directory: deploy/terraform/envs/dev
        run: |
          tofu init -backend=false -input=false
          tofu validate -no-color

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init && tflint --recursive
        working-directory: deploy/terraform

      - name: trivy IaC scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: deploy/terraform
          exit-code: "1"
          severity: HIGH,CRITICAL
