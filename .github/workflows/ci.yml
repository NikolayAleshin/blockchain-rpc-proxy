name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l -s .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; echo "run: make fmt"; exit 1; fi
      - name: golangci-lint (v2)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
          "$(go env GOPATH)/bin/golangci-lint" run

  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage gate (fail under 70%)
        run: |
          go tool cover -func=coverage.out | tail -1
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 < 70) ? 1 : 0 }' \
            || { echo "::error::coverage ${pct}% is below the 70% threshold"; exit 1; }
      - name: upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false

  vuln:
    name: Vulnerability scan (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    name: Docker build, scan & SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4

      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: polygon-rpc-proxy:ci
          build-args: VERSION=${{ github.sha }}

      - name: smoke test container
        run: |
          docker run -d --name rpcproxy -p 8080:8080 polygon-rpc-proxy:ci
          for i in $(seq 1 15); do curl -sf http://127.0.0.1:8080/healthz && break || sleep 1; done
          curl -sf http://127.0.0.1:8080/healthz
          docker rm -f rpcproxy

      - name: install trivy & syft
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: trivy image scan (fail on HIGH/CRITICAL)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed polygon-rpc-proxy:ci

      - name: generate SBOM (SPDX)
        run: syft polygon-rpc-proxy:ci -o spdx-json=sbom.spdx.json

      - name: upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json

  terraform:
    name: Terraform validate & scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v2

      - name: fmt check
        run: tofu fmt -check -recursive
        working-directory: deploy/terraform

      - name: validate dev env
        working-directory: deploy/terraform/envs/dev
        run: |
          tofu init -backend=false -input=false
          tofu validate -no-color

      - name: tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - run: tflint --init && tflint --recursive
        working-directory: deploy/terraform

      - name: install trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: trivy IaC scan (fail on HIGH/CRITICAL)
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL deploy/terraform
