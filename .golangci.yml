version: "2"

run:
  timeout: 3m

# Default linters (errcheck, govet, ineffassign, staticcheck, unused) are enabled
# by golangci-lint v2 out of the box; enable a few extras.
linters:
  enable:
    - bodyclose
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Tests use in-memory fake response bodies (NopCloser); closing is a no-op.
      # Production transport code closes/drains bodies correctly.
      - path: _test\.go
        linters:
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - blockchain-rpc-proxy
