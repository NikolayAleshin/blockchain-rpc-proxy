# Local observability demo: the proxy exports OTLP traces to an OpenTelemetry
# Collector -> Tempo, Prometheus scrapes /metrics, and Grafana ships provisioned
# datasources + a RED dashboard. One command, zero clicks:
#
#   docker compose -f deploy/observability/docker-compose.yaml up --build
#   # generate traffic:
#   curl -s -XPOST localhost:8080 -H 'content-type: application/json' \
#     -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber"}'
#   # open Grafana at http://localhost:3000 (anonymous admin)
name: rpc-observability

services:
  proxy:
    build:
      context: ../..
    environment:
      LISTEN_ADDR: ":8080"
      METRICS_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_SERVICE_NAME: "polygon-rpc-proxy"
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector:0.116.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "8888:8888" # collector self-metrics
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
