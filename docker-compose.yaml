services:
  proxy:
    build:
      context: .
      args:
        VERSION: dev
    image: polygon-rpc-proxy:dev
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      UPSTREAM_URL: "https://polygon.drpc.org"
      LOG_LEVEL: "info"
      METRICS_ENABLED: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/proxy", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
